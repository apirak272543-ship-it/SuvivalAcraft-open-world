<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SuvivalAcraft Open World — survival crafting game (web build)" />
    <title>SuvivalAcraft Open World</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0b0f1a; color: #ecf0ff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
      #app { position: relative; width: 100%; height: 100%; }
      canvas { position: absolute; inset: 0; image-rendering: pixelated; background: #0b0f1a; }
      #hud { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px; display: flex; gap: 16px; align-items: flex-start; pointer-events: none; flex-wrap: wrap; }
      .pill { background: rgba(10,15,26,.8); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 6px 12px; font-size: 13px; }
      .pill b { color: #8fb0ff; }
      #bars { position: absolute; bottom: 72px; left: 14px; display: grid; gap: 6px; width: 220px; pointer-events: none; }
      .bar { height: 14px; background: #14203a; border-radius: 7px; overflow: hidden; }
      .bar > i { display: block; height: 100%; }
      #hotbar { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; }
      .slot { width: 46px; height: 46px; border: 2px solid rgba(255,255,255,.15); border-radius: 8px; background: rgba(10,15,26,.8); display: grid; place-items: center; font-size: 11px; text-align: center; }
      .slot.active { border-color: #8fb0ff; background: rgba(143,176,255,.2); }
      #panel { position: absolute; right: 14px; top: 14px; width: 240px; background: rgba(10,15,26,.92); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 14px; }
      #panel h3 { margin: 0 0 8px; font-size: 14px; color: #8fb0ff; }
      #panel button { display: block; width: 100%; margin: 4px 0; padding: 7px 10px; border: 0; border-radius: 8px; background: #1c2b4d; color: #ecf0ff; cursor: pointer; font-size: 12px; text-align: left; }
      #panel button:hover { background: #284072; }
      #panel button:disabled { opacity: .4; cursor: not-allowed; }
      #msg { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #aaf0c2; text-shadow: 0 1px 3px #000; pointer-events: none; }
      .legend { position: absolute; bottom: 12px; left: 14px; font-size: 11px; color: #7f8db0; pointer-events: none; line-height: 1.6; }
      #start { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #16203a, #070b14); z-index: 5; }
      #start .card { text-align: center; padding: 30px 40px; border: 1px solid rgba(255,255,255,.15); border-radius: 20px; background: rgba(10,15,26,.8); max-width: 420px; }
      #start h1 { margin: 0 0 6px; font-size: 26px; }
      #start p { color: #9fb0d0; font-size: 14px; }
      #start input, #start select { margin-top: 12px; padding: 8px; width: 100%; border-radius: 8px; border: 1px solid #2a3b5f; background: #0d1526; color: #ecf0ff; }
      #start button { margin-top: 14px; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: linear-gradient(180deg,#8fb0ff,#577cff); color: #06101f; font-weight: 800; font-size: 15px; cursor: pointer; }
      @media (max-width: 640px) {
        #panel { width: 200px; }
        #bars { width: 160px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="960" height="600"></canvas>
      <div id="hud">
        <div class="pill">🌍 <b id="hud-pos">0,0</b></div>
        <div class="pill">🧙 <b id="hud-level">Lv 1</b></div>
        <div class="pill">⭐ <b id="hud-xp">0 XP</b></div>
      </div>
      <div id="bars">
        <div class="bar"><i id="bar-hp" style="width:100%;background:#e55039;"></i></div>
        <div class="bar"><i id="bar-hunger" style="width:100%;background:#f6b93b;"></i></div>
        <div class="bar"><i id="bar-thirst" style="width:100%;background:#4a9ef5;"></i></div>
      </div>
      <div id="hotbar"></div>
      <div id="msg"></div>
      <div class="legend">WASD เคลื่อนที่ · คลิก วางบล็อก/เก็บของ · [1-5] เลือกช่อง · C คราฟต์</div>
      <div id="panel"></div>
      <div id="start">
        <div class="card">
          <h1>🧱 SuvivalAcraft Open World</h1>
          <p>ตั้งชื่อและเลือกเมล็ดโลกเพื่อเริ่มสำรวจ เก็บของ คราฟต์ และเอาตัวรอด</p>
          <input id="name" placeholder="ชื่อผู้เล่น" value="ผู้เล่น" />
          <select id="world"></select>
          <button id="btn-start">เริ่มเกม</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
